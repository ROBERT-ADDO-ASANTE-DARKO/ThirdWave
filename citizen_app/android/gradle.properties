org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This dev machine has 6GB total RAM with very little free at idle --
# a persistent daemon holding memory open between builds risks the same
# resource exhaustion that froze the system once already. Each build
# pays a JVM startup cost instead, which is the safer trade here.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
